version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - gofmt
    - goimports
    - gocritic
    - revive
    - misspell
    - nolintlint

  settings:
    goimports:
      local-prefixes: github.com/I0-1O/draba
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    revive:
      rules:
        - name: exported
          severity: warning
    nolintlint:
      require-explanation: true
      require-specific: true

issues:
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
