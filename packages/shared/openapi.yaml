openapi: "3.0.3"

info:
  title: draba API
  description: Team coordination API — Phases 2–6 (auth, teams, events, timelines).
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Local development

# All authenticated endpoints require a Bearer JWT unless overridden with security: [].
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ────────────────────────────────────────────────────────────
  # Schemas
  # ────────────────────────────────────────────────────────────
  schemas:

    User:
      type: object
      required: [id, email, displayName, isSuperadmin, createdAt, updatedAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
          description: User-level identity color ID. Propagates to team memberships.
        icon:
          type: string
          nullable: true
          description: User-level identity icon ID. Propagates to team memberships.
        isSuperadmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          nullable: true
          format: date-time

    UpdateProfileInput:
      type: object
      properties:
        displayName:
          type: string
        color:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordInput:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string

    SMTPConfig:
      type: object
      properties:
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        password:
          type: string
          description: Masked in GET responses.
        fromName:
          type: string
        fromEmail:
          type: string
        encryption:
          type: string
          enum: [none, tls, starttls]

    AdminUserRow:
      type: object
      allOf:
        - $ref: '#/components/schemas/User'
      properties:
        teamCount:
          type: integer

    Team:
      type: object
      required: [id, name, slug, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
          description: Identity color ID (e.g. "teal"). Null until explicitly set.
        icon:
          type: string
          nullable: true
          description: Identity icon ID (e.g. "briefcase") or special value. Null until explicitly set.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          nullable: true
          format: date-time

    TeamMember:
      type: object
      required: [id, teamId, role, joinedAt]
      properties:
        id:
          type: string
          description: Team-member record ID (team_members.id).
        teamId:
          type: string
        userId:
          type: string
          nullable: true
        role:
          type: string
          enum: [admin, member]
        color:
          type: string
          nullable: true
          description: Identity color ID (e.g. "teal"). Null until explicitly set.
        icon:
          type: string
          nullable: true
          description: Identity icon ID or special value. Null until explicitly set.
        joinedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          nullable: true
          format: date-time
          description: Non-null when the member is inactivated.

    TeamMemberWithUser:
      allOf:
        - $ref: "#/components/schemas/TeamMember"
        - type: object
          required: [email, displayName]
          properties:
            email:
              type: string
              format: email
            displayName:
              type: string
            avatarUrl:
              type: string
              nullable: true

    MemberStats:
      type: object
      required: [activeTimelines, archivedTimelines, pastDue, running, upcoming, unscheduled, archivedActivities]
      properties:
        activeTimelines:
          type: integer
        archivedTimelines:
          type: integer
        pastDue:
          type: integer
          description: Activities with end_at in the past, not archived.
        running:
          type: integer
          description: Activities currently in progress (start_at ≤ now ≤ end_at), not archived.
        upcoming:
          type: integer
          description: Activities with start_at in the future, not archived.
        unscheduled:
          type: integer
          description: Activities with no start or end date, not archived.
        archivedActivities:
          type: integer

    MemberDetail:
      allOf:
        - $ref: "#/components/schemas/TeamMemberWithUser"
        - type: object
          required: [stats, teams, deletable]
          properties:
            stats:
              $ref: "#/components/schemas/MemberStats"
            teams:
              type: array
              items:
                $ref: "#/components/schemas/TeamMemberWithUser"
            deletable:
              type: boolean
              description: True when the member can be hard-deleted (no active activities, single team).
            userArchivedAt:
              type: string
              format: date-time
              nullable: true
              description: Set when the user account is deactivated (users.archived_at). Null for active accounts and participants.

    Invite:
      type: object
      required: [id, teamId, email, token, role, invitedBy, expiresAt, createdAt]
      properties:
        id:
          type: string
        teamId:
          type: string
        email:
          type: string
        token:
          type: string
        role:
          type: string
          enum: [admin, member]
        invitedBy:
          type: string
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          nullable: true
          format: date-time
        createdAt:
          type: string
          format: date-time

    InviteLink:
      type: object
      required: [token]
      properties:
        token:
          type: string
          nullable: true
          description: The current invite link token, or null if none is set.

    Activity:
      type: object
      required: [id, teamId, title, startAt, endAt, allDay, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
        teamId:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        allDay:
          type: boolean
        statusId:
          type: string
          nullable: true
        parentActivityId:
          type: string
          nullable: true
        percentComplete:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        location:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        rrule:
          type: string
          nullable: true
        caldavUid:
          type: string
          nullable: true
          description: External CalDAV VEVENT UID — preserved from Phase 12 calendar sync.
        googleEventId:
          type: string
          nullable: true
          description: External Google Calendar event ID — preserved from Phase 12 calendar sync.
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          nullable: true
          format: date-time
        assignedMemberIds:
          type: array
          items:
            type: string
          description: IDs of team_members assigned to this activity (from activity_assignments).

    Timeline:
      type: object
      required: [id, teamId, name, startDate, endDate, shareToken, icalToken, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
        teamId:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
          description: Identity color ID (e.g. "teal"). Null until explicitly set.
        icon:
          type: string
          nullable: true
          description: Identity icon ID or special value. Null until explicitly set.
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        shareToken:
          type: string
        icalToken:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          nullable: true
          format: date-time

    SavedFilter:
      type: object
      required: [id, teamId, userId, name, definition, createdAt, updatedAt]
      properties:
        id:
          type: string
        teamId:
          type: string
        userId:
          type: string
        name:
          type: string
        definition:
          type: string
          description: Opaque JSON filter spec (validated client-side).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserPreference:
      type: object
      required: [id, userId, key, value, updatedAt]
      properties:
        id:
          type: string
        userId:
          type: string
        timelineId:
          type: string
          nullable: true
          description: Empty string or absent means global (not timeline-scoped).
        key:
          type: string
          description: Preference key (e.g. group_by, sort_by, zoom_granularity, theme).
        value:
          type: string
          description: JSON-encoded preference value.
        updatedAt:
          type: string
          format: date-time

    APIToken:
      type: object
      required: [id, userId, name, scope, createdAt]
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
          description: Human-readable label (e.g. "ci-readonly").
        scope:
          type: string
          enum: [read, add, edit_own, edit_all]
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true

    APITokenCreated:
      allOf:
        - $ref: "#/components/schemas/APIToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The raw token value. Returned exactly once at creation; never re-fetchable.

    AuthResponse:
      type: object
      required: [user, accessToken, refreshToken]
      properties:
        user:
          $ref: "#/components/schemas/User"
        accessToken:
          type: string
        refreshToken:
          type: string

    RefreshResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

    RevokeUserResult:
      type: object
      required: [accountDeactivated, membershipsInactivated, membershipsRemoved]
      properties:
        accountDeactivated:
          type: boolean
        membershipsInactivated:
          type: integer
        membershipsRemoved:
          type: integer

    StatusTemplateItem:
      type: object
      required: [id, templateId, name, color, isClosed, position]
      properties:
        id:
          type: string
        templateId:
          type: string
        name:
          type: string
        color:
          type: string
          description: Hex color string (e.g. "#3B82F6").
        icon:
          type: string
          nullable: true
          description: Identity icon ID. Null if not set.
        isClosed:
          type: boolean
          description: Closed statuses filter activities out of active views.
        position:
          type: integer

    StatusTemplate:
      type: object
      required: [id, teamId, name, position, createdBy, createdAt, updatedAt, items]
      properties:
        id:
          type: string
        teamId:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        position:
          type: integer
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/StatusTemplateItem"

    Status:
      type: object
      required: [id, timelineId, name, color, isClosed, position, createdAt, updatedAt]
      properties:
        id:
          type: string
        timelineId:
          type: string
        name:
          type: string
        color:
          type: string
          description: Hex color string (e.g. "#3B82F6").
        icon:
          type: string
          nullable: true
          description: Identity icon ID. Null if not set.
        isClosed:
          type: boolean
          description: Closed statuses filter activities out of active views.
        position:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateStatusTemplateInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true

    PatchStatusTemplateInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        position:
          type: integer

    CreateStatusTemplateItemInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        color:
          type: string
        icon:
          type: string
          nullable: true
        isClosed:
          type: boolean

    PatchStatusTemplateItemInput:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
        icon:
          type: string
          nullable: true
        isClosed:
          type: boolean
        position:
          type: integer

    PatchTimelineInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        color:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    TimelineAccessEntry:
      type: object
      required: [timelineId, teamMemberId, role, displayName, email]
      properties:
        timelineId:
          type: string
        teamMemberId:
          type: string
        role:
          type: string
          enum: [admin, member]
        displayName:
          type: string
        email:
          type: string
        color:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        userId:
          type: string
          nullable: true

    CreateStatusInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        color:
          type: string
        icon:
          type: string
          nullable: true
        isClosed:
          type: boolean

    PatchStatusInput:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
        icon:
          type: string
          nullable: true
        isClosed:
          type: boolean
        position:
          type: integer

    DeleteStatusInput:
      type: object
      properties:
        replacementStatusId:
          type: string
          nullable: true
          description: Required when activities reference the deleted status.

  # ────────────────────────────────────────────────────────────
  # Reusable responses
  # ────────────────────────────────────────────────────────────
  responses:
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Unauthorized:
      description: Missing or invalid authentication token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Forbidden:
      description: Authenticated but not allowed to perform this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    PaymentRequired:
      description: Tier limit reached.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  # ────────────────────────────────────────────────────────────
  # Reusable parameters
  # ────────────────────────────────────────────────────────────
  parameters:
    teamId:
      name: id
      in: path
      required: true
      description: Team ID.
      schema:
        type: string

    activityId:
      name: id
      in: path
      required: true
      description: Activity ID.
      schema:
        type: string

    timelineId:
      name: id
      in: path
      required: true
      description: Timeline ID.
      schema:
        type: string

    timelineIdParam:
      name: timelineId
      in: path
      required: true
      description: Timeline ID (nested path parameter).
      schema:
        type: string

    savedFilterId:
      name: id
      in: path
      required: true
      description: Saved filter ID.
      schema:
        type: string

    id:
      name: id
      in: path
      required: true
      description: Resource ID.
      schema:
        type: string

    shareToken:
      name: token
      in: path
      required: true
      description: Public share token for a timeline.
      schema:
        type: string

# ────────────────────────────────────────────────────────────
# Paths
# ────────────────────────────────────────────────────────────
paths:

  /health:
    get:
      operationId: health
      summary: Health check
      security: []
      tags: [system]
      responses:
        "200":
          description: Server is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ── Auth ────────────────────────────────────────────────────

  /auth/register:
    post:
      operationId: register
      summary: Register a new user
      description: |
        The first user on a fresh install may register without an invite token
        (bootstrap). Every subsequent user must supply a valid invite token.
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                displayName:
                  type: string
                  minLength: 1
                inviteToken:
                  type: string
      responses:
        "201":
          description: User registered successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Email address is already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      operationId: login
      summary: Authenticate and obtain tokens
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Authenticated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Exchange a refresh token for a new access token
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: New access token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/me:
    get:
      operationId: getMe
      summary: Get the authenticated user's profile
      tags: [auth]
      responses:
        "200":
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── User preferences ─────────────────────────────────────────

  /users/me/preferences:
    get:
      operationId: getPreferences
      summary: Get preferences for the authenticated user
      description: |
        Returns all preferences matching the given scope. Omit timeline_id
        (or pass an empty string) to fetch global preferences.
      tags: [users]
      parameters:
        - name: timeline_id
          in: query
          required: false
          description: Scope results to a specific timeline. Omit for global prefs.
          schema:
            type: string
      responses:
        "200":
          description: Array of matching preferences.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserPreference"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: upsertPreference
      summary: Create or update a single preference
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                  description: Preference key (e.g. group_by, sort_by, zoom_granularity, theme).
                value:
                  type: string
                  description: JSON-encoded preference value.
                timelineId:
                  type: string
                  nullable: true
                  description: Omit or pass "" for a global preference.
      responses:
        "200":
          description: Upserted preference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreference"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── API Tokens ───────────────────────────────────────────────

  /tokens:
    get:
      operationId: listAPITokens
      summary: List API tokens owned by the caller
      tags: [tokens]
      responses:
        "200":
          description: Array of tokens (active and revoked). Raw token value is never included.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createAPIToken
      summary: Create a new API token
      description: |
        Mints a long-lived Bearer token scoped to the caller's account. The raw token
        value is returned exactly once in the response and never re-fetchable. API
        tokens cannot be used to mint other API tokens — this endpoint requires a JWT.
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope]
              properties:
                name:
                  type: string
                  minLength: 1
                scope:
                  type: string
                  enum: [read, add, edit_own, edit_all]
      responses:
        "201":
          description: Token created. The raw value is included in this response only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /tokens/{id}:
    delete:
      operationId: revokeAPIToken
      summary: Revoke an API token
      description: Marks the token as revoked. The row is preserved so the listing UI can show "Revoked on …".
      tags: [tokens]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Token revoked (or already revoked).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Teams ────────────────────────────────────────────────────

  /teams:
    get:
      operationId: listTeams
      summary: List teams for the authenticated user
      tags: [teams]
      parameters:
        - name: archived
          in: query
          required: false
          description: When `true`, include archived teams. Default excludes them.
          schema:
            type: string
            enum: [ "true", "false" ]
      responses:
        "200":
          description: Array of teams the user belongs to.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createTeam
      summary: Create a new team
      description: The authenticated user automatically becomes the team's first admin member.
      tags: [teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                description:
                  type: string
                  nullable: true
                notes:
                  type: string
                  nullable: true
                color:
                  type: string
                  nullable: true
                icon:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Team created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "500":
          $ref: "#/components/responses/InternalError"

  /teams/{id}:
    get:
      operationId: getTeam
      summary: Get a team by ID
      description: Any member of the team may fetch the team record.
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "200":
          description: Team record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      operationId: updateTeam
      summary: Partially update a team (admin only)
      description: Only fields present in the request body are modified. Only team admins may update.
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/teamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                description:
                  type: string
                  nullable: true
                notes:
                  type: string
                  nullable: true
                color:
                  type: string
                  nullable: true
                icon:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Updated team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /teams/{id}/archive:
    post:
      operationId: archiveTeam
      summary: Archive a team (admin only)
      description: Sets archivedAt on the team. The team is hidden from active pickers but all data is preserved.
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "200":
          description: The archived team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /teams/{id}/unarchive:
    post:
      operationId: unarchiveTeam
      summary: Restore a previously archived team (admin only)
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "200":
          description: The restored team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /teams/{id}/invites:
    get:
      operationId: listInvites
      summary: List pending invites for a team (admin only)
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "200":
          description: Array of pending invites.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createInvite
      summary: Create a team invite
      description: Only team admins may create invites. The token expires after 7 days.
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/teamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: If provided, the invite is scoped to this email address.
