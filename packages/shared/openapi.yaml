                  type: string
                  enum: [admin, member]
                  default: member
      responses:
        "201":
          description: Invite created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /teams/{id}/invites/{inviteId}:
    delete:
      operationId: revokeInvite
      summary: Revoke a pending invite (admin only)
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/teamId"
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Invite revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /teams/{id}/invite-link:
    get:
      operationId: getInviteLink
      summary: Get the current reusable invite link token (admin only)
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "200":
          description: Current invite link token (null if none is set).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createInviteLink
      summary: Generate or regenerate the reusable invite link (admin only)
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "200":
          description: New invite link token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: revokeInviteLink
      summary: Revoke the reusable invite link (admin only)
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "204":
          description: Invite link revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /teams/{id}/members:
    get:
      operationId: listTeamMembers
      summary: List members of a team
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "200":
          description: Array of team members with user display info.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMemberWithUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: addMember
      summary: Add an existing registered user to a team (admin only)
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/teamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                role:
                  type: string
                  enum: [admin, member]
                  default: member
      responses:
        "201":
          description: Member added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMemberWithUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: User is already a member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"

  /teams/{id}/members/{memberId}:
    get:
      operationId: getMember
      summary: Get a team member with computed stats
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/teamId"
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Member detail with stats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateMember
      summary: Update a team member's display name, identity, or role
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/teamId"
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  nullable: true
                color:
                  type: string
                  nullable: true
                icon:
                  type: string
                  nullable: true
                role:
                  type: string
                  enum: [admin, member]
      responses:
        "200":
          description: Updated member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMemberWithUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cannot demote the last admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteMember
      summary: Remove a member from a team (admin only)
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/teamId"
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Member removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cannot remove the last admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"

  /teams/{id}/members/{memberId}/archive:
    post:
      operationId: archiveMember
      summary: Inactivate a team member (admin only)
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/teamId"
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Inactivated member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMemberWithUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cannot inactivate the last admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"

  /teams/{id}/members/{memberId}/unarchive:
    post:
      operationId: unarchiveMember
      summary: Reactivate an inactivated team member (admin only)
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/teamId"
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reactivated member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMemberWithUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /teams/{id}/participants:
    post:
      operationId: createParticipant
      summary: Create a login-less participant (admin only)
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/teamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                color:
                  type: string
                  nullable: true
                icon:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Participant created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMemberWithUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/search:
    get:
      operationId: searchUsers
      summary: Search users by name or email
      description: Returns up to 20 matching non-archived users. Query must be at least 2 characters.
      tags: [users]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Matching users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/{id}/promote:
    post:
      operationId: promoteUser
      summary: Grant superadmin status to a user (superadmin only)
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/{id}/archive:
    post:
      operationId: archiveUser
      summary: Inactivate a user account (superadmin only)
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Inactivated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/{id}/unarchive:
    post:
      operationId: unarchiveUser
      summary: Reactivate an inactivated user account (superadmin only)
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reactivated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/{id}/revoke:
    post:
      operationId: revokeUser
      summary: Atomically revoke all access for a user (superadmin only)
      description: >
        Sets users.archived_at (blocks login everywhere), inactivates all team
        memberships that have activity assignments, and hard-deletes memberships
        with zero assignments. Returns a summary of the three operations.
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revocation summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeUserResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/{id}:
    delete:
      operationId: deleteUser
      summary: Hard-delete a user (superadmin only)
      description: Only permitted when the user has no active activities and belongs to a single team.
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: User deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: User cannot be deleted (multi-team or has active activities).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Activities ───────────────────────────────────────────────

  /teams/{id}/activities:
    post:
      operationId: createActivity
      summary: Create an activity in a team
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/teamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, startAt, endAt]
              properties:
                title:
                  type: string
                  minLength: 1
                description:
                  type: string
                  nullable: true
                icon:
                  type: string
                  nullable: true
                color:
                  type: string
                  nullable: true
                startAt:
                  type: string
                  format: date-time
                endAt:
                  type: string
                  format: date-time
                allDay:
                  type: boolean
                  default: false
                statusId:
                  type: string
                  nullable: true
                parentActivityId:
                  type: string
                  nullable: true
                percentComplete:
                  type: integer
                  nullable: true
                  minimum: 0
                  maximum: 100
                location:
                  type: string
                  nullable: true
                url:
                  type: string
                  nullable: true
                rrule:
                  type: string
                  nullable: true
                assignedMemberIds:
                  type: array
                  items:
                    type: string
                  description: IDs of team_members to assign. Replaces all existing assignments.
      responses:
        "201":
          description: Activity created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listActivities
      summary: List activities for a team
      description: Archived activities are excluded by default. Optional date-range filter on startAt.
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/teamId"
        - name: from
          in: query
          required: false
          description: Only return activities where startAt >= from (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Only return activities where startAt <= to (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: archived
          in: query
          required: false
          description: When `true`, include archived activities. Default excludes them.
          schema:
            type: string
            enum: [ "true", "false" ]
      responses:
        "200":
          description: Array of activities.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /activities/{id}:
    patch:
      operationId: updateActivity
      summary: Partially update an activity
      description: Only fields present in the request body are modified (true PATCH semantics).
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/activityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                description:
                  type: string
                  nullable: true
                icon:
                  type: string
                  nullable: true
                color:
                  type: string
                  nullable: true
                startAt:
                  type: string
                  format: date-time
                endAt:
                  type: string
                  format: date-time
                allDay:
                  type: boolean
                statusId:
                  type: string
                  nullable: true
                parentActivityId:
                  type: string
                  nullable: true
                percentComplete:
                  type: integer
                  nullable: true
                  minimum: 0
                  maximum: 100
                location:
                  type: string
                  nullable: true
                url:
                  type: string
                  nullable: true
                rrule:
                  type: string
                  nullable: true
                assignedMemberIds:
                  type: array
                  items:
                    type: string
                  description: IDs of team_members to assign. Replaces all existing assignments.
      responses:
        "200":
          description: Updated activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteActivity
      summary: Delete an activity
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/activityId"
      responses:
        "204":
          description: Activity deleted (no body).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /activities/{id}/archive:
    post:
      operationId: archiveActivity
      summary: Archive an activity (soft delete)
      description: Sets archivedAt on the activity so it is hidden from default list responses but can be restored via /activities/{id}/unarchive.
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/activityId"
      responses:
        "200":
          description: The archived activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /activities/{id}/unarchive:
    post:
      operationId: unarchiveActivity
      summary: Restore a previously archived activity
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/activityId"
      responses:
        "200":
          description: The restored activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Timelines ────────────────────────────────────────────────

  /teams/{id}/timelines:
    get:
      operationId: listTimelines
      summary: List timelines for a team
      tags: [timelines]
      parameters:
        - $ref: "#/components/parameters/teamId"
        - name: archived
          in: query
          required: false
          description: When `true`, include archived timelines. Default excludes them.
          schema:
            type: string
            enum: [ "true", "false" ]
      responses:
        "200":
          description: Array of non-archived timelines for the team.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Timeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createTimeline
      summary: Create a timeline for a team
      description: The authenticated user must be a member of the team. Restricted timelines automatically grant access to the creator.
      tags: [timelines]
      parameters:
        - $ref: "#/components/parameters/teamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, startDate, endDate]
              properties:
                name:
                  type: string
                  minLength: 1
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
                color:
                  type: string
                  nullable: true
                icon:
                  type: string
                  nullable: true
                description:
                  type: string
                  nullable: true
                notes:
                  type: string
                  nullable: true
                templateId:
                  type: string
                  nullable: true
                  description: ID of the status template to seed this timeline's statuses from. Uses the team's first template when omitted.
      responses:
        "201":
          description: Timeline created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /timelines/{id}/archive:
    post:
      operationId: archiveTimeline
      summary: Archive a timeline (admin only)
      description: Team admins only. Sets archivedAt on the timeline so it is hidden from default list responses but can be restored via /timelines/{id}/unarchive.
      tags: [timelines]
      parameters:
        - $ref: "#/components/parameters/timelineId"
      responses:
        "200":
          description: The archived timeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /timelines/{id}/unarchive:
    post:
      operationId: unarchiveTimeline
      summary: Restore a previously archived timeline
      tags: [timelines]
      parameters:
        - $ref: "#/components/parameters/timelineId"
      responses:
        "200":
          description: The restored timeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /timelines/{id}:
    get:
      operationId: getTimeline
      summary: Fetch a timeline by ID
      description: Requires team membership. Restricted timelines additionally require an entry in the access list.
      tags: [timelines]
      parameters:
        - $ref: "#/components/parameters/timelineId"
      responses:
        "200":
          description: Timeline found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      operationId: updateTimeline
      summary: Rename or change dates on a timeline (timeline admin only)
      tags: [timelines]
      parameters:
        - $ref: "#/components/parameters/timelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchTimelineInput"
      responses:
        "200":
          description: Updated timeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteTimeline
      summary: Hard-delete a timeline (team admin only)
      description: Deletes the timeline and all its statuses. Activities are NOT deleted.
      tags: [timelines]
      parameters:
        - $ref: "#/components/parameters/timelineId"
      responses:
        "204":
          description: Timeline deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /teams/{id}/timelines/{timelineId}/access:
    get:
      operationId: listTimelineAccess
      summary: List access grants for a timeline
      tags: [timelines]
      parameters:
        - $ref: "#/components/parameters/teamId"
        - $ref: "#/components/parameters/timelineIdParam"
      responses:
        "200":
          description: List of access grants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineAccessEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /teams/{id}/timelines/{timelineId}/access/{memberId}:
    put:
      operationId: grantTimelineAccess
      summary: Grant or update a team member's access to a timeline (timeline admin only)
      tags: [timelines]
      parameters:
        - $ref: "#/components/parameters/teamId"
        - $ref: "#/components/parameters/timelineIdParam"
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, member]
      responses:
        "200":
          description: Updated access list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineAccessEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: revokeTimelineAccess
      summary: Revoke a team member's access to a timeline (timeline admin only)
      tags: [timelines]
      parameters:
        - $ref: "#/components/parameters/teamId"
        - $ref: "#/components/parameters/timelineIdParam"
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Access revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Saved Filters ────────────────────────────────────────────

  /teams/{id}/saved_filters:
    get:
      operationId: listSavedFilters
      summary: List the authenticated user's saved filters for a team
      tags: [savedFilters]
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "200":
          description: Array of saved filters owned by the caller.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedFilter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createSavedFilter
      summary: Create a saved filter for the authenticated user in a team
      tags: [savedFilters]
      parameters:
        - $ref: "#/components/parameters/teamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, definition]
              properties:
                name:
                  type: string
                  minLength: 1
                definition:
                  type: string
                  description: Opaque JSON filter spec (validated client-side).
      responses:
        "201":
          description: Saved filter created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedFilter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /saved_filters/{id}:
    patch:
      operationId: updateSavedFilter
      summary: Partially update a saved filter (owner only)
      tags: [savedFilters]
      parameters:
        - $ref: "#/components/parameters/savedFilterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                definition:
                  type: string
      responses:
        "200":
          description: Updated saved filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedFilter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteSavedFilter
      summary: Delete a saved filter (owner only)
      tags: [savedFilters]
      parameters:
        - $ref: "#/components/parameters/savedFilterId"
      responses:
        "204":
          description: Saved filter deleted (no body).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Profile & Security ────────────────────────────────────────

  /users/me:
    patch:
      operationId: updateProfile
      summary: Update the authenticated user's display name, color, and icon
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: Updated user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/me/password:
    put:
      operationId: changePassword
      summary: Change the authenticated user's password
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request a password reset email
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Always 200; no email enumeration.
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Reset a password using a valid reset token
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Admin ─────────────────────────────────────────────────────

  /admin/smtp:
    get:
      operationId: getSMTPConfig
      summary: Get current SMTP configuration (password masked)
      tags: [admin]
      responses:
        "200":
          description: SMTP config or null when not configured.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: putSMTPConfig
      summary: Save and validate SMTP configuration
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SMTPConfig"
      responses:
        "200":
          description: SMTP config saved.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deleteSMTPConfig
      summary: Clear SMTP configuration
      tags: [admin]
      responses:
        "204":
          description: SMTP config cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/smtp/test:
    post:
      operationId: testSMTPConfig
      summary: Send a test email using supplied config without saving
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SMTPConfig"
      responses:
        "200":
          description: Test email sent.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /settings/branding:
    get:
      operationId: getPublicBranding
      summary: Get public branding settings (no auth required)
      description: >
        Returns the instance name and accent color. Intentionally public so the
        login page and shared timeline views can display branding before sign-in.
        Only cosmetic settings are exposed here.
      tags: [settings]
      security: []
      responses:
        "200":
          description: Public branding values.
          content:
            application/json:
              schema:
                type: object
                properties:
                  instanceName:
                    type: string
                    description: Admin-configured name shown in the browser tab and login page.
                  accentColor:
                    type: string
                    description: 6-digit hex override for the primary color (e.g. "#288C9B"). Empty string means no override.

  /admin/settings:
    get:
      operationId: getAdminSettings
      summary: Get instance-level settings
      tags: [admin]
      responses:
        "200":
          description: Instance settings map.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: patchAdminSettings
      summary: Update one or more instance-level settings
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        "200":
          description: Updated settings.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users:
    get:
      operationId: listAdminUsers
      summary: List all users with team membership counts
      tags: [admin]
      parameters:
        - name: orphaned
          in: query
          required: false
          description: When true, return only users with zero active team memberships.
          schema:
            type: boolean
      responses:
        "200":
          description: List of admin user rows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUserRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /teams/{teamId}/status-templates:
    get:
      operationId: listStatusTemplates
      summary: List all status templates for a team
      tags: [statusTemplates]
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of status templates with their items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createStatusTemplate
      summary: Create a status template
      tags: [statusTemplates]
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStatusTemplateInput"
      responses:
        "201":
          description: Created status template (with empty items array).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /status-templates/{id}:
    patch:
      operationId: updateStatusTemplate
      summary: Rename or reorder a status template
      tags: [statusTemplates]
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchStatusTemplateInput"
      responses:
        "200":
          description: Updated status template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteStatusTemplate
      summary: Delete a status template (blocked if it is the last one)
      tags: [statusTemplates]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cannot delete the last template on the team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /status-templates/{id}/items:
    post:
      operationId: createStatusTemplateItem
      summary: Add an item to a status template
      tags: [statusTemplates]
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStatusTemplateItemInput"
      responses:
        "201":
          description: Created template item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusTemplateItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /status-template-items/{id}:
    patch:
      operationId: updateStatusTemplateItem
      summary: Rename, recolor, reicon, toggle is_closed, or reorder a template item
      tags: [statusTemplates]
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchStatusTemplateItemInput"
      responses:
        "200":
          description: Updated template item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusTemplateItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteStatusTemplateItem
      summary: Delete a template item (blocked if it is the last one in the template)
      tags: [statusTemplates]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cannot delete the last item in a template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /teams/{teamId}/timelines/{timelineId}/statuses:
    get:
      operationId: listTimelineStatuses
      summary: List statuses for a specific timeline
      tags: [statuses]
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: timelineId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of timeline statuses in position order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: createTimelineStatus
      summary: Add a status to a timeline (timeline admin only)
      tags: [statuses]
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: timelineId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStatusInput"
      responses:
        "201":
          description: Status created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /statuses/{id}:
    patch:
      operationId: updateStatus
      summary: Rename, recolor, or reorder a timeline status (timeline admin only)
      tags: [statuses]
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchStatusInput"
      responses:
        "200":
          description: Updated status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteStatus
      summary: Delete a timeline status (timeline admin only)
      description: Blocked if it is the last status. Requires replacementStatusId if any activities reference the status.
      tags: [statuses]
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteStatusInput"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Last status or activities reference it without a replacement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"

  /timelines/share/{token}:
    get:
      operationId: getTimelineByShareToken
      summary: Fetch a timeline via its public share token
      description: No authentication required. The share token itself is the credential.
      security: []
      tags: [timelines]
      parameters:
        - $ref: "#/components/parameters/shareToken"
      responses:
        "200":
          description: Timeline found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
