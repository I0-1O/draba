openapi: "3.0.3"

info:
  title: draba API
  description: Team coordination API — Phases 2–6 (auth, teams, events, timelines).
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Local development

# All authenticated endpoints require a Bearer JWT unless overridden with security: [].
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ────────────────────────────────────────────────────────────
  # Schemas
  # ────────────────────────────────────────────────────────────
  schemas:

    User:
      type: object
      required: [id, email, displayName, createdAt, updatedAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Team:
      type: object
      required: [id, name, slug, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        color:
          type: string
          nullable: true
          description: Identity color ID (e.g. "teal"). Null until explicitly set.
        icon:
          type: string
          nullable: true
          description: Identity icon ID (e.g. "briefcase") or special value. Null until explicitly set.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TeamMember:
      type: object
      required: [id, teamId, role, joinedAt]
      properties:
        id:
          type: string
          description: Team-member record ID (team_members.id).
        teamId:
          type: string
        userId:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, admin, member]
        color:
          type: string
          nullable: true
          description: Identity color ID (e.g. "teal"). Null until explicitly set.
        icon:
          type: string
          nullable: true
          description: Identity icon ID or special value. Null until explicitly set.
        joinedAt:
          type: string
          format: date-time

    TeamMemberWithUser:
      allOf:
        - $ref: "#/components/schemas/TeamMember"
        - type: object
          required: [email, displayName]
          properties:
            email:
              type: string
              format: email
            displayName:
              type: string
            avatarUrl:
              type: string
              nullable: true

    Invite:
      type: object
      required: [id, teamId, email, token, role, invitedBy, expiresAt, createdAt]
      properties:
        id:
          type: string
        teamId:
          type: string
        email:
          type: string
        token:
          type: string
        role:
          type: string
          enum: [admin, member]
        invitedBy:
          type: string
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          nullable: true
          format: date-time
        createdAt:
          type: string
          format: date-time

    Activity:
      type: object
      required: [id, teamId, title, startAt, endAt, allDay, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
        teamId:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        allDay:
          type: boolean
        statusId:
          type: string
          nullable: true
        parentActivityId:
          type: string
          nullable: true
        percentComplete:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        location:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        rrule:
          type: string
          nullable: true
        caldavUid:
          type: string
          nullable: true
          description: External CalDAV VEVENT UID — preserved from Phase 12 calendar sync.
        googleEventId:
          type: string
          nullable: true
          description: External Google Calendar event ID — preserved from Phase 12 calendar sync.
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          nullable: true
          format: date-time
        assignedMemberIds:
          type: array
          items:
            type: string
          description: IDs of team_members assigned to this activity (from activity_assignments).

    Timeline:
      type: object
      required: [id, teamId, name, startDate, endDate, shareToken, icalToken, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
        teamId:
          type: string
        name:
          type: string
        color:
          type: string
          nullable: true
          description: Identity color ID (e.g. "teal"). Null until explicitly set.
        icon:
          type: string
          nullable: true
          description: Identity icon ID or special value. Null until explicitly set.
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        shareToken:
          type: string
        icalToken:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          nullable: true
          format: date-time

    SavedFilter:
      type: object
      required: [id, teamId, userId, name, definition, createdAt, updatedAt]
      properties:
        id:
          type: string
        teamId:
          type: string
        userId:
          type: string
        name:
          type: string
        definition:
          type: string
          description: Opaque JSON filter spec (validated client-side).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserPreference:
      type: object
      required: [id, userId, key, value, updatedAt]
      properties:
        id:
          type: string
        userId:
          type: string
        timelineId:
          type: string
          nullable: true
          description: Empty string or absent means global (not timeline-scoped).
        key:
          type: string
          description: Preference key (e.g. group_by, sort_by, zoom_granularity, theme).
        value:
          type: string
          description: JSON-encoded preference value.
        updatedAt:
          type: string
          format: date-time

    APIToken:
      type: object
      required: [id, userId, name, scope, createdAt]
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
          description: Human-readable label (e.g. "ci-readonly").
        scope:
          type: string
          enum: [read, add, edit_own, edit_all]
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true

    APITokenCreated:
      allOf:
        - $ref: "#/components/schemas/APIToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The raw token value. Returned exactly once at creation; never re-fetchable.

    AuthResponse:
      type: object
      required: [user, accessToken, refreshToken]
      properties:
        user:
          $ref: "#/components/schemas/User"
        accessToken:
          type: string
        refreshToken:
          type: string

    RefreshResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

  # ────────────────────────────────────────────────────────────
  # Reusable responses
  # ────────────────────────────────────────────────────────────
  responses:
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Unauthorized:
      description: Missing or invalid authentication token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Forbidden:
      description: Authenticated but not allowed to perform this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    PaymentRequired:
      description: Tier limit reached.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  # ────────────────────────────────────────────────────────────
  # Reusable parameters
  # ────────────────────────────────────────────────────────────
  parameters:
    teamId:
      name: id
      in: path
      required: true
      description: Team ID.
      schema:
        type: string

    activityId:
      name: id
      in: path
      required: true
      description: Activity ID.
      schema:
        type: string

    timelineId:
      name: id
      in: path
      required: true
      description: Timeline ID.
      schema:
        type: string

    savedFilterId:
      name: id
      in: path
      required: true
      description: Saved filter ID.
      schema:
        type: string

    shareToken:
      name: token
      in: path
      required: true
      description: Public share token for a timeline.
      schema:
        type: string

# ────────────────────────────────────────────────────────────
# Paths
# ────────────────────────────────────────────────────────────
paths:

  /health:
    get:
      operationId: health
      summary: Health check
      security: []
      tags: [system]
      responses:
        "200":
          description: Server is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ── Auth ────────────────────────────────────────────────────

  /auth/register:
    post:
      operationId: register
      summary: Register a new user
      description: |
        The first user on a fresh install may register without an invite token
        (bootstrap). Every subsequent user must supply a valid invite token.
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                displayName:
                  type: string
                  minLength: 1
                inviteToken:
                  type: string
      responses:
        "201":
          description: User registered successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Email address is already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      operationId: login
      summary: Authenticate and obtain tokens
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Authenticated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Exchange a refresh token for a new access token
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: New access token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/me:
    get:
      operationId: getMe
      summary: Get the authenticated user's profile
      tags: [auth]
      responses:
        "200":
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── User preferences ─────────────────────────────────────────

  /users/me/preferences:
    get:
      operationId: getPreferences
      summary: Get preferences for the authenticated user
      description: |
        Returns all preferences matching the given scope. Omit timeline_id
        (or pass an empty string) to fetch global preferences.
      tags: [users]
      parameters:
        - name: timeline_id
          in: query
          required: false
          description: Scope results to a specific timeline. Omit for global prefs.
          schema:
            type: string
      responses:
        "200":
          description: Array of matching preferences.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserPreference"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: upsertPreference
      summary: Create or update a single preference
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                  description: Preference key (e.g. group_by, sort_by, zoom_granularity, theme).
                value:
                  type: string
                  description: JSON-encoded preference value.
                timelineId:
                  type: string
                  nullable: true
                  description: Omit or pass "" for a global preference.
      responses:
        "200":
          description: Upserted preference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreference"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── API Tokens ───────────────────────────────────────────────

  /tokens:
    get:
      operationId: listAPITokens
      summary: List API tokens owned by the caller
      tags: [tokens]
      responses:
        "200":
          description: Array of tokens (active and revoked). Raw token value is never included.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createAPIToken
      summary: Create a new API token
      description: |
        Mints a long-lived Bearer token scoped to the caller's account. The raw token
        value is returned exactly once in the response and never re-fetchable. API
        tokens cannot be used to mint other API tokens — this endpoint requires a JWT.
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope]
              properties:
                name:
                  type: string
                  minLength: 1
                scope:
                  type: string
                  enum: [read, add, edit_own, edit_all]
      responses:
        "201":
          description: Token created. The raw value is included in this response only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /tokens/{id}:
    delete:
      operationId: revokeAPIToken
      summary: Revoke an API token
      description: Marks the token as revoked. The row is preserved so the listing UI can show "Revoked on …".
      tags: [tokens]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Token revoked (or already revoked).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Teams ────────────────────────────────────────────────────

  /teams:
    get:
      operationId: listTeams
      summary: List teams for the authenticated user
      tags: [teams]
      responses:
        "200":
          description: Array of teams the user belongs to.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createTeam
      summary: Create a new team
      description: The authenticated user automatically becomes the team's first admin member.
      tags: [teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
      responses:
        "201":
          description: Team created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "500":
          $ref: "#/components/responses/InternalError"

  /teams/{id}:
    get:
      operationId: getTeam
      summary: Get a team by ID
      description: Any member of the team may fetch the team record.
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "200":
          description: Team record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /teams/{id}/invites:
    post:
      operationId: createInvite
      summary: Create a team invite
      description: Only team admins may create invites. The token expires after 7 days.
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/teamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: If provided, the invite is scoped to this email address.
                role:
                  type: string
                  enum: [admin, member]
                  default: member
      responses:
        "201":
          description: Invite created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /teams/{id}/members:
    get:
      operationId: listTeamMembers
      summary: List members of a team
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "200":
          description: Array of team members with user display info.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMemberWithUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Activities ───────────────────────────────────────────────

  /teams/{id}/activities:
    post:
      operationId: createActivity
      summary: Create an activity in a team
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/teamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, startAt, endAt]
              properties:
                title:
                  type: string
                  minLength: 1
                description:
                  type: string
                  nullable: true
                icon:
                  type: string
                  nullable: true
                color:
                  type: string
                  nullable: true
                startAt:
                  type: string
                  format: date-time
                endAt:
                  type: string
                  format: date-time
                allDay:
                  type: boolean
                  default: false
                statusId:
                  type: string
                  nullable: true
                parentActivityId:
                  type: string
                  nullable: true
                percentComplete:
                  type: integer
                  nullable: true
                  minimum: 0
                  maximum: 100
                location:
                  type: string
                  nullable: true
                url:
                  type: string
                  nullable: true
                rrule:
                  type: string
                  nullable: true
                assignedMemberIds:
                  type: array
                  items:
                    type: string
                  description: IDs of team_members to assign. Replaces all existing assignments.
      responses:
        "201":
          description: Activity created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listActivities
      summary: List activities for a team
      description: Archived activities are excluded by default. Optional date-range filter on startAt.
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/teamId"
        - name: from
          in: query
          required: false
          description: Only return activities where startAt >= from (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Only return activities where startAt <= to (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: archived
          in: query
          required: false
          description: When `true`, include archived activities. Default excludes them.
          schema:
            type: string
            enum: [ "true", "false" ]
      responses:
        "200":
          description: Array of activities.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /activities/{id}:
    patch:
      operationId: updateActivity
      summary: Partially update an activity
      description: Only fields present in the request body are modified (true PATCH semantics).
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/activityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                description:
                  type: string
                  nullable: true
                icon:
                  type: string
                  nullable: true
                color:
                  type: string
                  nullable: true
                startAt:
                  type: string
                  format: date-time
                endAt:
                  type: string
                  format: date-time
                allDay:
                  type: boolean
                statusId:
                  type: string
                  nullable: true
                parentActivityId:
                  type: string
                  nullable: true
                percentComplete:
                  type: integer
                  nullable: true
                  minimum: 0
                  maximum: 100
                location:
                  type: string
                  nullable: true
                url:
                  type: string
                  nullable: true
                rrule:
                  type: string
                  nullable: true
                assignedMemberIds:
                  type: array
                  items:
                    type: string
                  description: IDs of team_members to assign. Replaces all existing assignments.
      responses:
        "200":
          description: Updated activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteActivity
      summary: Delete an activity
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/activityId"
      responses:
        "204":
          description: Activity deleted (no body).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /activities/{id}/archive:
    post:
      operationId: archiveActivity
      summary: Archive an activity (soft delete)
      description: Sets archivedAt on the activity so it is hidden from default list responses but can be restored via /activities/{id}/unarchive.
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/activityId"
      responses:
        "200":
          description: The archived activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /activities/{id}/unarchive:
    post:
      operationId: unarchiveActivity
      summary: Restore a previously archived activity
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/activityId"
      responses:
        "200":
          description: The restored activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Timelines ────────────────────────────────────────────────

  /teams/{id}/timelines:
    get:
      operationId: listTimelines
      summary: List timelines for a team
      tags: [timelines]
      parameters:
        - $ref: "#/components/parameters/teamId"
        - name: archived
          in: query
          required: false
          description: When `true`, include archived timelines. Default excludes them.
          schema:
            type: string
            enum: [ "true", "false" ]
      responses:
        "200":
          description: Array of non-archived timelines for the team.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Timeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createTimeline
      summary: Create a timeline for a team
      description: The authenticated user must be a member of the team. Restricted timelines automatically grant access to the creator.
      tags: [timelines]
      parameters:
        - $ref: "#/components/parameters/teamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, startDate, endDate]
              properties:
                name:
                  type: string
                  minLength: 1
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
      responses:
        "201":
          description: Timeline created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /timelines/{id}/archive:
    post:
      operationId: archiveTimeline
      summary: Archive a timeline (admin only)
      description: Team admins only. Sets archivedAt on the timeline so it is hidden from default list responses but can be restored via /timelines/{id}/unarchive.
      tags: [timelines]
      parameters:
        - $ref: "#/components/parameters/timelineId"
      responses:
        "200":
          description: The archived timeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /timelines/{id}/unarchive:
    post:
      operationId: unarchiveTimeline
      summary: Restore a previously archived timeline
      tags: [timelines]
      parameters:
        - $ref: "#/components/parameters/timelineId"
      responses:
        "200":
          description: The restored timeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /timelines/{id}:
    get:
      operationId: getTimeline
      summary: Fetch a timeline by ID
      description: Requires team membership. Restricted timelines additionally require an entry in the access list.
      tags: [timelines]
      parameters:
        - $ref: "#/components/parameters/timelineId"
      responses:
        "200":
          description: Timeline found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Saved Filters ────────────────────────────────────────────

  /teams/{id}/saved_filters:
    get:
      operationId: listSavedFilters
      summary: List the authenticated user's saved filters for a team
      tags: [savedFilters]
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "200":
          description: Array of saved filters owned by the caller.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedFilter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createSavedFilter
      summary: Create a saved filter for the authenticated user in a team
      tags: [savedFilters]
      parameters:
        - $ref: "#/components/parameters/teamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, definition]
              properties:
                name:
                  type: string
                  minLength: 1
                definition:
                  type: string
                  description: Opaque JSON filter spec (validated client-side).
      responses:
        "201":
          description: Saved filter created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedFilter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /saved_filters/{id}:
    patch:
      operationId: updateSavedFilter
      summary: Partially update a saved filter (owner only)
      tags: [savedFilters]
      parameters:
        - $ref: "#/components/parameters/savedFilterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                definition:
                  type: string
      responses:
        "200":
          description: Updated saved filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedFilter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteSavedFilter
      summary: Delete a saved filter (owner only)
      tags: [savedFilters]
      parameters:
        - $ref: "#/components/parameters/savedFilterId"
      responses:
        "204":
          description: Saved filter deleted (no body).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /timelines/share/{token}:
    get:
      operationId: getTimelineByShareToken
      summary: Fetch a timeline via its public share token
      description: No authentication required. The share token itself is the credential.
      security: []
      tags: [timelines]
      parameters:
        - $ref: "#/components/parameters/shareToken"
      responses:
        "200":
          description: Timeline found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
